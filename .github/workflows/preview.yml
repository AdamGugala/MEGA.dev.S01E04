name: Manual digest preview

on:
  workflow_dispatch:
    inputs:
      remove_marker:
        description: Replace the preview with an unmarked copy after review
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.4.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Render digest preview
        shell: bash
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          REMOVE_MARKER: ${{ inputs.remove_marker }}
          PORT: '8787'
        run: |
          set -euo pipefail

          if [[ "$REMOVE_MARKER" == "true" ]]; then
            unset LANE_MARKER
          elif [[ -z "${LANE_MARKER//[[:space:]]/}" ]]; then
            echo '::error::LANE_MARKER must be configured for a marked preview.'
            exit 1
          fi

          preview_dir="$RUNNER_TEMP/preview"
          mkdir -p "$preview_dir"

          # Start Node directly: the PID belongs to the server, and no .env is loaded.
          node --import tsx src/server.ts > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::Preview server exited before rendering the digest.'
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8787/digest/2026-10-28 \
              --output "$preview_dir/index.html"; then
              exit 0
            fi
            sleep 1
          done

          echo '::error::Digest preview was not ready after 30 attempts.'
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/preview
          retention-days: 1

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5
